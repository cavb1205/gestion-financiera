# Context: http. Only known UI routes are mapped; inbound query strings are dropped.
map $uri $cartera_legacy_destination {
    default /dashboard;
    ~^/register/?$ /register;
    ~^/select/?$ /select-store;
    ~^/liquidar(?:/(?:pay|nopay))?/?$ /dashboard/liquidar;
    ~^/ventas/create/?$ /dashboard/ventas/nueva;
    ~^/ventas/perdidas?/?$ /dashboard/ventas/perdidas;
    ~^/ventas/(?<legacy_sale_id>[0-9]+)/?$ /dashboard/ventas/$legacy_sale_id;
    ~^/ventas(?:/(?:update|delete))?/?$ /dashboard/ventas;
    ~^/clientes/create/?$ /dashboard/clientes/crear;
    ~^/clientes/(?<legacy_client_id>[0-9]+)/?$ /dashboard/clientes/$legacy_client_id;
    ~^/clientes(?:/(?:update|delete|disponibles))?/?$ /dashboard/clientes;
    ~^/gastos/create/?$ /dashboard/gastos/crear;
    ~^/gastos(?:/.*)?$ /dashboard/gastos;
    ~^/aportes/create/?$ /dashboard/aportes/crear;
    ~^/aportes(?:/.*)?$ /dashboard/aportes;
    ~^/utilidades/create/?$ /dashboard/utilidades/crear;
    ~^/utilidades(?:/.*)?$ /dashboard/utilidades;
    ~^/recaudos(?:/.*)?$ /dashboard/recaudos;
    ~^/trabajadores/create/?$ /dashboard/trabajadores/crear;
    ~^/trabajadores/(?<legacy_worker_id>[0-9]+)/?$ /dashboard/trabajadores/$legacy_worker_id;
    ~^/trabajadores(?:/.*)?$ /dashboard/trabajadores;
    ~^/(?:cierres|cierre/delete/confirm)/?$ /dashboard/cierre-caja;
    ~^/tiendas(?:/.*)?$ /select-store;
    ~^/expired/?$ /dashboard/membresias;
    ~^/informes(?:/.*)?$ /dashboard/reportes/utilidad;
}
