# Temporary retirement of the legacy UI. API and webhook have a separate vhost.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /etc/nginx/snippets/cartera-private-files.conf;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name carterafinanciera.com www.carterafinanciera.com;
    root /var/www/html;
    if ($host !~* ^(?:www\.)?carterafinanciera\.com$) { return 404; }

    ssl_certificate /etc/letsencrypt/live/carterafinanciera.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carterafinanciera.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/cartera-private-files.conf;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Keep renewal and the identity/icons of existing installed web apps working.
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location = /manifest.json { try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; }
    location = /favico.ico { try_files $uri =404; }
    location = /logo192.png { try_files $uri =404; }
    location = /logo512.png { try_files $uri =404; }

    location / {
        return 302 https://app.carterafinanciera.com/actualizar-app?destino=$cartera_legacy_destination;
    }
}
